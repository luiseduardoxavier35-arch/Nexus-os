---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
# NEXUS OS initial image recipe.
name: nexus-os
description: "NEXUS OS Alpha 0.1 — Gaming Edition"
base-image: ghcr.io/ublue-os/bazzite
image-version: stable
modules:
  - type: files
    files:
      - source: system
        destination: /
  - type: script
    snippets:
      - chmod 0755 /usr/bin/nexus-emulator-manager
      - python3 -m py_compile /usr/bin/nexus-emulator-manager
